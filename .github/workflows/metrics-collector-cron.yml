# Dispara metrics-collector cada 6h (Fase 3 del plan estratégico, ver CLAUDE.md).
# La función trae métricas reales desde Zernio Analytics (ZERNIO_API_KEY ya
# cargado como secret de Supabase desde 2026-08-05). Un post cuyas analíticas
# Zernio nunca sincroniza (202) se informa aparte, no cuenta como error del cron.
name: Metrics Collector Cron

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

# Solo hace un curl a una Edge Function — no toca el repo.
permissions: {}

jobs:
  collect:
    name: Recolectar métricas
    runs-on: ubuntu-latest
    steps:
      - name: Invocar metrics-collector (collect-all)
        run: |
          code=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/metrics-collector" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"action":"collect-all"}')
          echo "HTTP $code"
          cat /tmp/response.json
          if [ "$code" -ge 300 ]; then exit 1; fi
