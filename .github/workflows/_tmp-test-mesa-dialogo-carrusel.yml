# Workflow temporal — prueba supervisada real del fix de carrusel (662059a)
# a pedido de Pablo, 2026-08-24. Corre una sesión real de Mesa de Diálogo
# (orchestrator, action "start") con un tema real basado en el buyer persona
# "El Emprendedor Saturado", pidiendo formato carrusel explícito para forzar
# el mismo camino de código que produjo el bug del guion crudo. Se borra
# apenas se confirma el resultado — mismo patrón ya usado varias veces en
# este repo (ver CLAUDE.md, pruebas de copilot/Groq).
name: _tmp test mesa dialogo carrusel

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Continuar sesión real (corregir CTA, buscar aprobación)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS -X POST "$SUPABASE_URL/functions/v1/orchestrator" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"action":"continue","sessionId":"a662557c-a195-412d-9f14-a13931290773","feedback":"El Crítico tiene razón: corregí el CTA final para que sea exactamente \"¿Cómo está tu empresa hoy? Agendá tu reunión de evaluación — link en bio.\", sin cambiar ninguna otra palabra (no uses \"sesión de claridad\", esa frase es solo para DMs). Dejá el hook, el body y los hashtags exactamente igual."}' \
            -o response.json
          echo "--- RESPUESTA COMPLETA ---"
          cat response.json
