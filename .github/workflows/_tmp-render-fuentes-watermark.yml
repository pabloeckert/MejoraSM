# Workflow temporal — verifica en la pipeline real (GitHub Actions, no
# local) el fix de fuentes reales (Bw Modelica embebida en base64) y el
# isotipo de fondo, con el carrusel de muestra ya real (d975b7e9). Solo
# renderiza, no publica. Se borra apenas se confirme el resultado.
name: _tmp render fuentes watermark

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        run: npm install playwright

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Buscar propuestas debidas y renderizar la imagen
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/render-scheduled-posts.mjs

      - name: Commitear imágenes renderizadas (públicas vía raw.githubusercontent.com)
        run: |
          git config user.name "mejora-story-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/published content/used
          git diff --cached --quiet || git commit -m "test: render de muestra fuentes+watermark (NO publicado)"
          git push

      - name: Mostrar manifiesto real
        run: cat content/work/scheduled-posts.json
