# Publica hub/ (la página para subir material) a GitHub Pages.
#
# GitHub Pages en modo "workflow" sirve UN solo artifact por sitio — por eso
# este workflow arma un _site/ que combina hub/ (raíz) + dashboard/ (subpath) +
# biblioteca/ (subpath) + dist/ del EDA (subpath /app/), igual que
# deploy-dashboard.yml, deploy-biblioteca.yml y deploy-eda.yml. Si cualquiera
# de los cuatro solo subiera su propia parte, se pisarían entre sí en cada
# corrida.
name: Deploy Hub

on:
  push:
    branches: [main]
    paths: ["hub/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias EDA
        run: npm ci --legacy-peer-deps

      - name: Build EDA (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /MejoraSM/app/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Armar sitio combinado (hub/ + dashboard/ + biblioteca/ + app/)
        run: |
          mkdir -p _site
          cp -r hub/. _site/
          if [ -d dashboard ]; then
            mkdir -p _site/dashboard
            cp -r dashboard/. _site/dashboard/
          fi
          if [ -d biblioteca ]; then
            mkdir -p _site/biblioteca
            cp -r biblioteca/. _site/biblioteca/
          fi
          mkdir -p _site/app
          cp -r dist/. _site/app/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
