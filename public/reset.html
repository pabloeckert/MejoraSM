<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Blanqueo de contraseña — MejoraSM</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7; color: #1a1a1a; padding: 1rem;
    }
    @media (prefers-color-scheme: dark) { body { background: #0f0f12; color: #f2f2f2; } .card { background: #1a1a1f; border-color: #33333a; } input { background: #111; color: #f2f2f2; border-color: #444; } }
    .card {
      width: 100%; max-width: 360px; background: #fff; border: 1px solid #e2e2e6;
      border-radius: 14px; padding: 1.75rem; box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    h1 { font-size: 1.1rem; margin: 0 0 .25rem; }
    p.sub { margin: 0 0 1.25rem; font-size: .85rem; opacity: .7; }
    label { display: block; font-size: .8rem; font-weight: 600; margin: .9rem 0 .3rem; }
    input {
      width: 100%; padding: .6rem .7rem; border: 1px solid #d0d0d6; border-radius: 8px;
      font-size: .95rem; background: #fff;
    }
    button {
      width: 100%; margin-top: 1.25rem; padding: .65rem; border: 0; border-radius: 8px;
      background: #1A3D84; color: #fff; font-size: .95rem; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .msg { margin-top: .9rem; font-size: .85rem; }
    .msg.err { color: #c0392b; }
    .msg.ok { color: #1e7e34; }
    a.back { display: inline-block; margin-top: 1rem; font-size: .85rem; color: #1A3D84; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Nueva contraseña</h1>
    <p class="sub">Elegí una contraseña nueva para la cuenta de MejoraSM.</p>
    <div id="form-wrap">
      <label for="pw">Contraseña nueva</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="6" />
      <label for="pw2">Repetir contraseña</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="6" />
      <button id="go">Guardar contraseña</button>
    </div>
    <div id="msg" class="msg" role="status"></div>
    <a class="back" id="back" href="./">Volver a la app</a>
  </div>

  <script>
    var SUPABASE_URL = "https://hsglmdarztrshihmzfph.supabase.co";
    var ANON = "sb_publishable_GXn6-T6gWNSzZR-sIQ6_5g_97ZCFxWp";

    function qp(name, str) {
      var m = new RegExp("[#&?]" + name + "=([^&]+)").exec(str || "");
      return m ? decodeURIComponent(m[1]) : null;
    }

    // El link de Supabase (flujo implícito) vuelve con los tokens en el hash:
    // reset.html#access_token=...&refresh_token=...&type=recovery
    var hash = window.location.hash || "";
    var accessToken = qp("access_token", hash);
    var errDesc = qp("error_description", hash) || qp("error_description", window.location.search);

    var msg = document.getElementById("msg");
    var wrap = document.getElementById("form-wrap");

    if (errDesc) {
      wrap.style.display = "none";
      msg.className = "msg err";
      msg.textContent = errDesc.replace(/\+/g, " ");
    } else if (!accessToken) {
      wrap.style.display = "none";
      msg.className = "msg err";
      msg.textContent = "Este link no es válido o ya venció. Pedí uno nuevo desde 'Olvidé la contraseña'.";
    }

    document.getElementById("go").addEventListener("click", async function () {
      var pw = document.getElementById("pw").value;
      var pw2 = document.getElementById("pw2").value;
      msg.className = "msg";
      msg.textContent = "";
      if (pw.length < 6) { msg.className = "msg err"; msg.textContent = "Mínimo 6 caracteres."; return; }
      if (pw !== pw2) { msg.className = "msg err"; msg.textContent = "Las contraseñas no coinciden."; return; }

      var btn = this;
      btn.disabled = true;
      btn.textContent = "Guardando…";
      try {
        var res = await fetch(SUPABASE_URL + "/auth/v1/user", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            apikey: ANON,
            Authorization: "Bearer " + accessToken,
          },
          body: JSON.stringify({ password: pw }),
        });
        if (!res.ok) {
          var body = await res.json().catch(function () { return {}; });
          throw new Error(body.msg || body.error_description || ("Error " + res.status));
        }
        wrap.style.display = "none";
        msg.className = "msg ok";
        msg.textContent = "Listo, contraseña actualizada. Ya podés entrar.";
        document.getElementById("back").textContent = "Ir a la app";
      } catch (e) {
        btn.disabled = false;
        btn.textContent = "Guardar contraseña";
        msg.className = "msg err";
        msg.textContent = e.message || "No se pudo actualizar la contraseña.";
      }
    });
  </script>
</body>
</html>
