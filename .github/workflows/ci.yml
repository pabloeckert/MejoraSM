name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Solo lee el código y sube un artifact — sin acceso de escritura al repo.
permissions:
  contents: read

# Un push nuevo sobre la misma rama/PR cancela el CI anterior en vuelo — no
# tiene sentido gastar un runner validando un commit ya superado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # PM5 (auditoría 2026-08-31): la deuda de lint bajó de 42 errores a 0
      # (no-explicit-any tipados, eslint acotado a src/, Deno fuera de scope).
      # Se saca continue-on-error — lint vuelve a ser bloqueante.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
