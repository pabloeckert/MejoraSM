# Bandeja de conversaciones (Fase 1 del plan de publicación 2026).
# Cada 3 horas trae comentarios y DMs nuevos de Instagram + Facebook desde
# Zernio, los guarda en inbox_items y clasifica el sentimiento de los
# entrantes nuevos con un llamado corto al LLM. No responde nada — eso lo
# hace una persona desde /conversaciones.
name: Inbox Sync Cron

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

# Solo hace un curl a una Edge Function — no toca el repo.
permissions: {}

jobs:
  sync:
    name: Sincronizar bandeja de conversaciones
    runs-on: ubuntu-latest
    steps:
      - name: Invocar inbox (sync)
        run: |
          code=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/inbox" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"action":"sync"}')
          echo "HTTP $code"
          cat /tmp/response.json
          if [ "$code" -ge 300 ]; then exit 1; fi
