# Publica hub/ (la página para subir material) a GitHub Pages.
# Aislado del resto: no toca webapp/, no toca Vercel, no toca nada de la app EDA.
name: Deploy Hub

on:
  push:
    branches: [main]
    paths: ["hub/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "hub"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
