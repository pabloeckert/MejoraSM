name: _tmp zernio probe 2
on: { workflow_dispatch: {} }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: comments on older FB feed posts + conversation messages
        run: |
          KEY="${{ secrets.ZERNIO_API_KEY }}"
          FBACC="${{ secrets.ZERNIO_FACEBOOK_ACCOUNT_ID }}"
          IGACC="${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}"
          echo "=== FB posts page 2 (ids + platformPostId) ==="
          curl -s "https://zernio.com/api/v1/posts?accountId=$FBACC&page=2&limit=10" -H "Authorization: Bearer $KEY" \
            | python3 -c "import sys,json;d=json.load(sys.stdin); [print(p['_id'], p.get('status'), (p.get('content') or '')[:40]) for p in d.get('posts',[])]"
          echo "=== try comments on each of first 8 FB feed posts ==="
          for pid in $(curl -s "https://zernio.com/api/v1/posts?accountId=$FBACC&page=1&limit=8" -H "Authorization: Bearer $KEY" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(p['_id']) for p in d.get('posts',[])]"); do
            echo "-- post $pid --"
            curl -s "https://zernio.com/api/v1/inbox/comments/$pid?accountId=$FBACC" -H "Authorization: Bearer $KEY" | head -c 1500
            echo
          done
          echo "=== conversation messages (IG, first convo) ==="
          CID=$(curl -s "https://zernio.com/api/v1/inbox/conversations?accountId=$IGACC&limit=1" -H "Authorization: Bearer $KEY" | python3 -c "import sys,json;print(json.load(sys.stdin)['data'][0]['id'])")
          echo "conversation id: $CID"
          curl -s "https://zernio.com/api/v1/inbox/conversations/$CID/messages?accountId=$IGACC" -H "Authorization: Bearer $KEY" | head -c 2500
          echo
          curl -s "https://zernio.com/api/v1/inbox/conversations/$CID?accountId=$IGACC" -H "Authorization: Bearer $KEY" | head -c 2500
          echo
