# TEMPORAL — probe de cuentas de Zernio. Se borra apenas confirma.
name: _tmp Zernio probe

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cuentas conectadas (solo platform + id + nombre)
        run: |
          curl -sS "https://zernio.com/api/v1/accounts" \
            -H "Authorization: Bearer ${{ secrets.ZERNIO_API_KEY }}" \
          | jq -r '.accounts[] | "\(.platform)\t\(._id)\t\(.displayName // .selectedPageName // .username // "?")\tenabled=\(.enabled)\tactive=\(.isActive)"'
