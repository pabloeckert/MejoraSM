name: TEMP Zernio Inspect

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID a inspeccionar (GET /v1/posts/{id})"
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: GET post y mostrar JSON completo
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: |
          curl -s -H "Authorization: Bearer $ZERNIO_API_KEY" \
            "https://zernio.com/api/v1/posts/${{ inputs.post_id }}" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.stringify(JSON.parse(d),null,2)))"
