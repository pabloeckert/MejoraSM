# Registra que una story se gestionó A MANO (ej.: borrar una story de
# Instagram desde la app, porque Zernio no puede despublicar Instagram por
# API). Solo escribe content/log/acciones-manuales.json — no llama a Zernio,
# no usa ningún secret de Zernio. Cero riesgo real.
name: Mark Manual Action

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID de Zernio (columna del dashboard, botón Copiar ID)"
        required: true
        type: string
      platform:
        description: "Plataforma gestionada a mano"
        required: true
        type: choice
        options:
          - instagram

permissions:
  contents: write

jobs:
  mark:
    name: "Marcar gestionado a mano — ${{ inputs.platform }} — ${{ inputs.post_id }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Registrar acción manual
        run: node scripts/mark-manual.mjs "${{ inputs.post_id }}" "${{ inputs.platform }}"

      - name: Commitear registro
        run: |
          git config user.name "mejora-story-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/log/acciones-manuales.json
          git diff --cached --quiet || git commit -m "chore: marcar ${{ inputs.post_id }} (${{ inputs.platform }}) como gestionado a mano"
          git push
