# Workflow temporal — prueba visual real del fix de diseño uniforme +
# cierre en 3 slides (feedback de Pablo 2026-08-24). Inserta a mano una
# propuesta de prueba (is_test=true, NO se autoagenda por el orchestrator,
# se borra apenas se confirma) con el mismo contenido real ya aprobado por
# el Crítico, y renderiza SIN publicar para revisar las imágenes. Se borra
# apenas se confirme el resultado.
name: _tmp render test uniform

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        run: npm install playwright

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Buscar propuestas debidas y renderizar la imagen
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/render-scheduled-posts.mjs

      - name: Commitear imágenes renderizadas (públicas vía raw.githubusercontent.com)
        run: |
          git config user.name "mejora-story-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/published content/used
          git diff --cached --quiet || git commit -m "test: render de prueba diseño uniforme (NO publicado)"
          git push

      - name: Mostrar manifiesto real
        run: cat content/work/scheduled-posts.json
