# Story diaria automática — genera copy con Claude (API directa), renderiza la
# imagen de marca y publica en Instagram + Facebook. Sin Supabase, sin Meta directo: todo el motor
# vive acá, en GitHub Actions.
name: Daily Story

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC = 10:00 ART
  workflow_dispatch: {}

concurrency:
  group: daily-story
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  story:
    name: Generar y publicar story
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        run: npm install playwright

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Generar briefs de copy (Claude, API directa)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-brief.mjs

      - name: Renderizar imágenes de las stories
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/render-story.mjs

      - name: Commitear imágenes renderizadas (públicas vía raw.githubusercontent.com)
        run: |
          git config user.name "mejora-story-bot"
          git config user.email "actions@users.noreply.github.com"
          # `git add <ruta-inexistente>` sale con 128 y mata el paso — filtrar
          # las que existen (content/inbox puede no existir si nunca se subió
          # una foto por el Hub; el `.gitkeep` la mantiene, pero por las dudas).
          for p in content/published content/used content/inbox; do
            [ -e "$p" ] && git add "$p" || true
          done
          git diff --cached --quiet && { echo "nada que commitear"; exit 0; }
          git commit -m "story: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push rechazado, reintento $i…"; sleep 5
          done
          echo "no se pudo pushear"; exit 1

      - name: Publicar en Instagram y Facebook (vía Zernio)
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}
          ZERNIO_FACEBOOK_ACCOUNT_ID: ${{ secrets.ZERNIO_FACEBOOK_ACCOUNT_ID }}
          RAW_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/publish-story.mjs

      - name: Subir briefs/renders como artifact (para debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-story-${{ github.run_id }}
          path: |
            content/work/briefs.json
            content/work/renders.json
          if-no-files-found: ignore
