name: _tmp ads probe
on: { workflow_dispatch: {} }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ep in "ads/accounts" "ads/campaigns" "ads/insights"; do
            echo "=== GET /v1/$ep ==="
            curl -s -w "\n[HTTP %{http_code}]\n" \
              "https://zernio.com/api/v1/$ep" \
              -H "Authorization: Bearer ${{ secrets.ZERNIO_API_KEY }}" | head -c 900
            echo
          done
