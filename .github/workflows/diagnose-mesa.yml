name: Diagnose Mesa & Unblock DB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnosticar y Desbloquear Mesa
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run diagnostic & unblock script
        run: node scripts/diagnose-and-unblock.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Supabase CLI Logs
        if: always()
        run: |
          npm install -g supabase
          npx supabase login --token ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          echo "=== LOGS RECIENTES DE ORCHESTRATOR ==="
          npx supabase functions logs orchestrator --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
