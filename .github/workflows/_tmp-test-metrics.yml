# Workflow temporal para diagnosticar por qué 2 posts publicados no
# tienen fila en metrics todavía. Se borra apenas se confirma la causa.
name: TEMP Test Metrics Collect

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Invocar metrics-collector (collect puntual)
        run: |
          for pair in "79fa97ca-f935-4a00-91ed-f7c4115d34e5:6a748af4013927dbb8084d9a" "c074942a-a673-42d5-8844-45f45846bfec:6a733992eb70294ba1f7abfb"; do
            proposalId="${pair%%:*}"
            postId="${pair##*:}"
            echo "=== $postId ==="
            code=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
              "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/metrics-collector" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"action\":\"collect\",\"proposalId\":\"$proposalId\",\"postId\":\"$postId\"}")
            echo "HTTP $code"
            cat /tmp/response.json
            echo ""
          done
