# Aplica supabase/migrations/ a la base de datos real.
# Trigger: solo manual (workflow_dispatch) — a diferencia de deploy-functions.yml,
# una migración de schema es más riesgosa que redeployar código de función, así
# que no se dispara sola en cada push a supabase/migrations/**. Usa los mismos
# secrets que ya existen en el repo para deploy-functions.yml.
name: Deploy Migrations

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo mostrar qué se aplicaría, sin tocar la base real'
        type: boolean
        default: false

permissions:
  contents: read

# Nunca cancelar una migración a mitad — si hay una corriendo, la siguiente espera.
concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Aplicar migraciones a Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Login to Supabase
        run: npx supabase login --token ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # No hay paso "Link project" a propósito — mismo hallazgo real ya
      # documentado en deploy-functions.yml: `supabase link` pega contra
      # GET /v1/projects/{ref}/api-keys, que devuelve un inserted_at que no
      # matchea el regex ISO8601 que espera el CLI (SchemaError real) y
      # tira el step abajo. Este workflow nunca se corrigió cuando se
      # encontró el mismo problema en deploy-functions.yml — `db push`
      # acepta `--project-ref` directo (confirmado contra la doc oficial de
      # Supabase), igual que `functions deploy`, sin necesitar el link
      # previo. `--linked` se saca porque depende de un vínculo local
      # guardado por `link` — que en un runner efímero de Actions nunca
      # existió.
      - name: Aplicar migraciones (supabase db push)
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --dry-run --debug
          else
            npx supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --yes --debug
          fi
