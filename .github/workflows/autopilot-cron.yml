# Modo libre autónomo con aviso previo — decisión de Pablo (2026-09-01):
# "Opción A, pero avisame antes de cada publicación autónoma".
#
# Lun/Mié/Vie 06:00 UTC (03:00 ART): el sistema propone un tema, debate, y si
# el Crítico aprueba, agenda la pieza para las 23:00 UTC (~20:00 ART) del
# mismo día y le manda un email a Pablo. Si no cancela desde /propuestas
# antes de esa hora, publish-scheduled-posts.yml la publica.
#
# Ver scripts/autopilot.mjs para el detalle.
name: Autopilot (modo libre + aviso)

on:
  # Confirmado end-to-end el 2026-09-01 (workflow_dispatch real: tema elegido,
  # Crítico aprobó, pieza agendada, email recibido por Pablo). Lun/Mié/Vie
  # 06:00 UTC (03:00 ART) → pieza a las 23:00 UTC (~20:00 ART), ~17h de veto.
  schedule:
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch: {}

# Dos corridas solapadas podrían crear dos propuestas para el mismo día
# (el dedup de orchestrator.startSession lo mitiga, pero mejor no depender de eso).
concurrency:
  group: autopilot
  cancel-in-progress: false

# Solo hace un curl a una Edge Function — no toca el repo.
permissions: {}

jobs:
  autopilot:
    name: Proponer, debatir y avisar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Correr autopilot
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: node scripts/autopilot.mjs
