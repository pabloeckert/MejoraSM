# Registra que un post/story se gestionó A MANO — el caso original era
# Instagram (Zernio no puede despublicar Instagram por API), pero
# "facebook" se agregó el 2026-08-20 tras un caso real: Pablo borró un
# post de feed a mano en las dos plataformas directo desde las apps
# (bypaseando a Zernio) porque el copy había salido con un bug real (ver
# CLAUDE.md, "Ronda de revisión post-Fase 6"). Solo escribe
# content/log/acciones-manuales.json (+ historial_cache en Supabase) — no
# llama a Zernio, no usa ningún secret de Zernio. Cero riesgo real.
name: Mark Manual Action

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID de Zernio (columna del dashboard, botón Copiar ID)"
        required: true
        type: string
      platform:
        description: "Plataforma gestionada a mano"
        required: true
        type: choice
        options:
          - instagram
          - facebook

permissions:
  contents: write

jobs:
  mark:
    name: "Marcar gestionado a mano — ${{ inputs.platform }} — ${{ inputs.post_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Registrar acción manual
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/mark-manual.mjs "${{ inputs.post_id }}" "${{ inputs.platform }}"

      - name: Commitear registro
        run: |
          git config user.name "mejora-story-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/log/acciones-manuales.json
          git diff --cached --quiet || git commit -m "chore: marcar ${{ inputs.post_id }} (${{ inputs.platform }}) como gestionado a mano"
          git push
