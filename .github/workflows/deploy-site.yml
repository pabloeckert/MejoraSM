# Publica el sitio combinado a GitHub Pages en UN solo artifact:
#   /            → hub/ (redirige a /app/)
#   /app/        → build de Vite del EDA (src/)
#   /dashboard/  → dashboard/ (monitor estático de solo lectura)
#
# GitHub Pages en modo "workflow" sirve un solo artifact por sitio, así que
# TODO el sitio se reconstruye en cada deploy — no se puede publicar solo una
# parte sin borrar el resto. Antes había 3 workflows casi idénticos
# (deploy-eda / deploy-hub / deploy-dashboard) que ya habían empezado a
# divergir (los guards `if [ -d ]`, el nombre de un step); se unificaron acá
# el 2026-09-03. `hub/CNAME` declara el dominio propio (mejorasm.mejoraok.com).

name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      # EDA (src/ + config del build)
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "tailwind.config.ts"
      - "tsconfig*.json"
      - "components.json"
      # Páginas estáticas del sitio combinado
      - "hub/**"
      - "dashboard/**"
      # Este workflow (así un cambio acá se autodespliega)
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Build EDA (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /app/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Armar sitio combinado
        run: |
          mkdir -p _site
          cp -r hub/. _site/               # raíz + hub/CNAME (dominio propio)
          if [ -d dashboard ]; then
            mkdir -p _site/dashboard
            cp -r dashboard/. _site/dashboard/
          fi
          mkdir -p _site/app
          cp -r dist/. _site/app/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
