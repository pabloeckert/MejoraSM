<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MejoraSM — Estratega Digital Autónoma</title>

    <!-- Anti-clickjacking. GitHub Pages es un host estático: no puede setear
         X-Frame-Options ni un CSP `frame-ancestors` (esas dos solo valen como
         header HTTP, no como <meta>). El EDA no se embebe en ningún lado — si
         aparece dentro de un iframe, rompemos el frame. -->
    <script>
      if (window.self !== window.top) {
        try { window.top.location = window.self.location.href; } catch (e) { document.documentElement.style.display = "none"; }
      }
    </script>
    <meta name="description" content="Sistema EDA — Gestión estratégica de contenidos en Instagram con IA para MejoraOK. Agentes que debaten, crean y optimizan tu contenido." />
    <meta name="author" content="MejoraOK" />
    <meta name="theme-color" content="#1A3D84" />
    <link rel="canonical" href="https://mejorasm.mejoraok.com/app/" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <!-- League Spartan: fallback / --font-heading-alt. Bw Modelica (woff2 local)
         carga primero. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&display=swap"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="MejoraSM — Estratega Digital Autónoma" />
    <meta property="og:description" content="Gestión estratégica de contenidos en Instagram con IA para Mejora Continua" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mejorasm.mejoraok.com/app/" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="MejoraSM" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@mejoraok" />
    <meta name="twitter:title" content="MejoraSM — Estratega Digital Autónoma" />
    <meta name="twitter:description" content="Agentes de IA que crean contenido estratégico para Instagram" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https: blob:;
      connect-src 'self' http://127.0.0.1:4002 http://localhost:4002 http://127.0.0.1:4015 http://localhost:4015 ws://localhost:* ws://127.0.0.1:* https://*.supabase.co;
      frame-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
