# Dispara rule-engine diariamente (Fase 3 del plan estratégico, ver CLAUDE.md).
# Con menos de 5 métricas guardadas, la función responde rulesFound:0 sin error
# (ver analyzeMetrics() en supabase/functions/rule-engine/index.ts) — no hace
# falta esperar a tener datos para activar el cron. También corre
# backfillExperiments() (Fase 4 del plan de publicación 2026).
name: Rule Engine Cron

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# Solo hace un curl a una Edge Function — no toca el repo.
permissions: {}

jobs:
  analyze:
    name: Analizar métricas y generar reglas
    runs-on: ubuntu-latest
    steps:
      - name: Invocar rule-engine (analyze)
        run: |
          code=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/rule-engine" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"action":"analyze"}')
          echo "HTTP $code"
          cat /tmp/response.json
          if [ "$code" -ge 300 ]; then exit 1; fi
