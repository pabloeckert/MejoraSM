# Publica dashboard/ (monitor de stories, solo lectura) a GitHub Pages.
#
# GitHub Pages en modo "workflow" sirve UN solo artifact por sitio — por eso
# este workflow arma un _site/ que combina hub/ (raíz) + dashboard/ (subpath),
# igual que deploy-hub.yml. Si cualquiera de los dos solo subiera su propia
# carpeta, se pisarían entre sí en cada corrida — así conviven en el mismo
# sitio sin que uno borre al otro.
name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths: ["dashboard/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Armar sitio combinado (hub/ + dashboard/)
        run: |
          mkdir -p _site
          if [ -d hub ]; then
            cp -r hub/. _site/
          fi
          mkdir -p _site/dashboard
          cp -r dashboard/. _site/dashboard/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
