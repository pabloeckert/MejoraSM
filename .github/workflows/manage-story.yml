# Acciones manuales sobre un post ya publicado en Zernio (Instagram/Facebook).
# NUNCA genera contenido nuevo ni llama a Claude — "reintentar" reusa la misma
# imagen y caption que ya están en content/log/historial.json, solo para la
# plataforma elegida. Requiere escribir "confirmacion: CONFIRMO" al disparar
# el workflow — cualquier otro valor corta antes de tocar nada.
name: Manage Story

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID de Zernio (columna del dashboard, botón Copiar ID)"
        required: true
        type: string
      platform:
        description: "Plataforma sobre la que actuar"
        required: true
        type: choice
        options:
          - instagram
          - facebook
      action:
        description: "Qué hacer"
        required: true
        type: choice
        options:
          - reintentar
          - despublicar
      confirmacion:
        description: 'Escribí exactamente CONFIRMO para ejecutar (cualquier otro valor corta sin hacer nada)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  manage:
    name: "${{ inputs.action }} — ${{ inputs.platform }} — ${{ inputs.post_id }}"
    runs-on: ubuntu-latest

    steps:
      - name: Verificar confirmación
        env:
          CONFIRMACION: ${{ inputs.confirmacion }}
        run: |
          if [ "$CONFIRMACION" != "CONFIRMO" ]; then
            echo "::error::Confirmación inválida (se esperaba exactamente CONFIRMO) — corto sin hacer nada."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar acción
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}
          ZERNIO_FACEBOOK_ACCOUNT_ID: ${{ secrets.ZERNIO_FACEBOOK_ACCOUNT_ID }}
        run: node scripts/manage-story.mjs "${{ inputs.post_id }}" "${{ inputs.platform }}" "${{ inputs.action }}"
