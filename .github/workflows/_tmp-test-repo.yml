name: _tmp test repo function
on: { workflow_dispatch: {} }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: listDir
        run: |
          curl -s -X POST "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/repo" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"action":"listDir","path":"content/inbox"}'
          echo
      - name: readFile manifest
        run: |
          curl -s -X POST "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/repo" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"action":"readFile","path":"content/work/publish-now.json"}'
          echo
