<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MejoraSM</title>
<meta name="robots" content="noindex" />
<!-- La raíz del sitio redirige a la app. El "Subí material" vive dentro de
     MejoraSM (/app/#/hub) — sin GitHub a la vista, con la subida por el
     servidor. Este archivo estático quedó solo como puerta de entrada. -->
<meta http-equiv="refresh" content="0; url=/app/" />
<link rel="canonical" href="https://mejorasm.mejoraok.com/app/" />
<style>
  :root { --azul: #1A3D84; --rojo: #E1061E; --amarillo: #F7CC13; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: #fff; color: #2B2B2B; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 24px; text-align: center;
  }
  .dots { display: flex; gap: 10px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: var(--rojo); } .dot.a { background: var(--amarillo); } .dot.z { background: var(--azul); }
  h1 { font-size: 22px; font-weight: 700; color: var(--azul); letter-spacing: -0.01em; }
  p { color: #6B7280; font-size: 15px; }
  a.btn {
    display: inline-block; margin-top: 4px; background: var(--azul); color: #fff;
    text-decoration: none; padding: 12px 22px; border-radius: 10px; font-weight: 600; font-size: 15px;
  }
</style>
</head>
<body>
  <div class="dots"><span class="dot r"></span><span class="dot a"></span><span class="dot z"></span></div>
  <h1>MejoraSM</h1>
  <p>Te estamos llevando a la app…</p>
  <a class="btn" href="/app/">Entrar a MejoraSM</a>
  <script>location.replace("/app/");</script>
</body>
</html>
