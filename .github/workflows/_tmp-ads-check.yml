# TEMPORAL — verificar el filtro de la función ads. Se borra apenas confirma.
name: _tmp ads check

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /functions/v1/ads {report}
        run: |
          curl -sS -X POST "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/ads" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"action":"report"}' | head -c 3000
          echo ""
