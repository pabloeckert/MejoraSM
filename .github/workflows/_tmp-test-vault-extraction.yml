# Workflow temporal — prueba real de extracción de PDF/DOCX en vault-process
# (fix 2026-08-25, hallazgo de auditoría). Sube un PDF y un DOCX reales
# (generados a mano, texto conocido) a la Bóveda real y confirma que el
# contenido extraído es texto legible real, no basura binaria. Se borra
# apenas se confirme el resultado, junto con los documentos de prueba.
name: _tmp test vault extraction

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probar extracción real de PDF y DOCX
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/_tmp-test-vault-extraction.mjs
