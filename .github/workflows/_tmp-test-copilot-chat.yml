# Workflow temporal, solo para verificar en vivo la acción "chat" de
# copilot (Fase 4). Se borra apenas se confirma que funciona — no es
# infraestructura permanente del proyecto.
name: TEMP Test Copilot Chat

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Invocar copilot (chat)
        run: |
          code=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/copilot" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"action":"chat","question":"¿Cuántas métricas reales tenemos hoy y qué tan confiables son?","history":[]}')
          echo "HTTP $code"
          cat /tmp/response.json
          if [ "$code" -ge 300 ]; then exit 1; fi
