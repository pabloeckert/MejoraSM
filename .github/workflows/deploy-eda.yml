# Publica el EDA (src/, build de Vite) a GitHub Pages, en el subpath /app/.
#
# Hasta ahora el EDA no tenía ningún destino de deploy confirmado: Hostinger
# (util.mejoraok.com) no resuelve DNS y Vercel (mejorasm.vercel.app) devuelve
# 404 — ningún proyecto conectado (ver README.md). GitHub Pages es el único
# destino que se puede desplegar y verificar de punta a punta sin credenciales
# nuevas (ya hay un sitio de Pages activo para hub/dashboard). Si
# más adelante se decide Vercel u otro hosting, este workflow se puede
# desactivar sin tocar el resto.
#
# GitHub Pages en modo "workflow" sirve UN solo artifact por sitio — por eso
# este workflow arma un _site/ que combina hub/ (raíz) + dashboard/ (subpath)
# + dist/ del EDA (subpath /app/), igual que
# deploy-hub.yml y deploy-dashboard.yml. Si cualquiera
# de los cuatro solo subiera su propia parte, se pisarían entre sí.

name: Deploy EDA

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "tailwind.config.ts"
      - "tsconfig*.json"
      - "components.json"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Build EDA (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /MejoraSM/app/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Armar sitio combinado (hub/ + dashboard/ + app/)
        run: |
          mkdir -p _site
          cp -r hub/. _site/
          if [ -d dashboard ]; then
            mkdir -p _site/dashboard
            cp -r dashboard/. _site/dashboard/
          fi
          mkdir -p _site/app
          cp -r dist/. _site/app/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
