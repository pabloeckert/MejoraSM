# Sincroniza el historial real de posts (Instagram + Facebook) desde Zernio
# a content/log/historial.json — base de solo lectura para el dashboard.
name: Sync Story History

on:
  schedule:
    - cron: "0 */6 * * *" # cada 6 horas
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    name: Sincronizar historial de stories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Traer historial desde Zernio
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}
          ZERNIO_FACEBOOK_ACCOUNT_ID: ${{ secrets.ZERNIO_FACEBOOK_ACCOUNT_ID }}
          RAW_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: node scripts/sync-history.mjs

      - name: Commitear historial actualizado
        run: |
          git config user.name "mejora-story-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/log/historial.json
          git diff --cached --quiet || git commit -m "chore: sincronizar historial de stories ($(date -u +%Y-%m-%d\ %H:%M\ UTC))"
          git push
